name: Build IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer

      - name: Fix line endings
        run: |
          find . -name "*.swift" -exec sed -i '' 's/\r$//' {} \; 2>/dev/null || true
          find . -name "*.plist" -exec sed -i '' 's/\r$//' {} \; 2>/dev/null || true

      - name: Show project info
        run: |
          xcodebuild -project DoveHarper.xcodeproj -list

      - name: Inject secrets
        run: |
          cat > DoveHarper/Secrets.swift << 'SECRETS_EOF'
          import Foundation

          enum Secrets {
              static let githubPAT = "${{ secrets.GH_PAT }}"
              static let githubOwner = "doveharperauthor"
              static let githubRepo = "DoveHarper-site"
              static let shopifyAccessToken = "${{ secrets.SHOPIFY_ACCESS_TOKEN }}"
              static let shopifyShopURL = "doveharpershop.myshopify.com"
              static let tryPostAPIKey = "${{ secrets.TRYPOST_API_KEY }}"
          }
          SECRETS_EOF

      - name: Build for iOS Device
        run: |
          set -e
          xcodebuild build \
            -project DoveHarper.xcodeproj \
            -scheme DoveHarper \
            -configuration Release \
            -derivedDataPath build \
            -sdk iphoneos \
            ARCHS=arm64 \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ENABLE_BITCODE=NO

      - name: Package IPA
        if: success()
        run: |
          set -e
          APP_PATH="build/Build/Products/Release-iphoneos/DoveHarper.app"

          if [ ! -d "$APP_PATH" ]; then
            echo "ERROR: DoveHarper.app not found at $APP_PATH"
            echo "Contents of build/Build/Products:"
            find build/Build/Products -type d -maxdepth 3 2>/dev/null || echo "No products"
            exit 1
          fi

          echo "Found app at: $APP_PATH"
          ls -la "$APP_PATH"

          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r DoveHarper.ipa Payload
          ls -lh DoveHarper.ipa

          # Verify IPA has binary
          if ! unzip -l DoveHarper.ipa | grep -q "DoveHarper.app/DoveHarper"; then
            echo "ERROR: IPA does not contain DoveHarper binary"
            exit 1
          fi

      - name: Upload IPA to Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: DoveHarper v1.0.${{ github.run_number }}
          files: DoveHarper.ipa
          generate_release_notes: true
          body: |
            ## DoveHarper iOS App v1.0.${{ github.run_number }}

            ### Installation
            1. Download `DoveHarper.ipa` below
            2. Transfer to your iPhone (AirDrop, iCloud, etc.)
            3. Open with LiveContainer
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
