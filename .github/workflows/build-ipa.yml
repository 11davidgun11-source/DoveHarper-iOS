name: Build IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer

      - name: Fix line endings
        run: |
          find . -name "*.swift" -exec sed -i '' 's/\r$//' {} \; 2>/dev/null || true
          find . -name "*.plist" -exec sed -i '' 's/\r$//' {} \; 2>/dev/null || true

      - name: Create export options
        run: |
          cat > /tmp/ExportOptions.plist << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>development</string>
              <key>compileBitcode</key>
              <false/>
              <key>signingStyle</key>
              <string>automatic</string>
          </dict>
          </plist>
          EOF

      - name: Archive for iOS
        run: |
          xcodebuild archive \
            -project DoveHarper.xcodeproj \
            -scheme DoveHarper \
            -destination 'generic/platform=iOS' \
            -archivePath build/DoveHarper.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ENABLE_BITCODE=NO \
            2>&1 | tail -50

      - name: Create IPA
        run: |
          # The archive creates a .xcarchive with the app
          ARCHIVE_PATH="build/DoveHarper.xcarchive"
          APP_PATH="$ARCHIVE_PATH/Products/Applications/DoveHarper.app"
          
          if [ ! -d "$APP_PATH" ]; then
            echo "App not found in archive, searching..."
            find build -name "DoveHarper.app" -type d 2>/dev/null
            APP_PATH=$(find build -name "DoveHarper.app" -type d | head -1)
          fi
          
          if [ -z "$APP_PATH" ] || [ ! -d "$APP_PATH" ]; then
            echo "ERROR: Could not find DoveHarper.app"
            exit 1
          fi
          
          echo "Found app at: $APP_PATH"
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r DoveHarper.ipa Payload
          ls -lh DoveHarper.ipa

      - name: Upload IPA to Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: DoveHarper v1.0.${{ github.run_number }}
          files: DoveHarper.ipa
          generate_release_notes: true
          body: |
            ## DoveHarper iOS App v1.0.${{ github.run_number }}
            
            ### Installation
            1. Download `DoveHarper.ipa` below
            2. Transfer to your iPhone (AirDrop, iCloud, etc.)
            3. Open with LiveContainer
            4. Trust the developer profile in Settings > General > VPN & Device Management
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
