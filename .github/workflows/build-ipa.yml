name: Build IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer

      - name: Create Xcode Project
        run: |
          cd DoveHarper
          
          # Create project structure
          mkdir -p DoveHarper.xcodeproj
          
          # Generate project.pbxproj
          cat > DoveHarper.xcodeproj/project.pbxproj << 'PBXPROJ'
          // !$*UTF8*$!
          {
          	archiveVersion = 1;
          	classes = {
          	};
          	objectVersion = 56;
          	objects = {
          
          /* Begin PBXBuildFile section */
          	AA000001 /* DoveHarperApp.swift in Sources */ = {isa = PBXBuildFile; fileRef = AB000001; };
          	AA000002 /* Models.swift in Sources */ = {isa = PBXBuildFile; fileRef = AB000002; };
          	AA000003 /* GitHubService.swift in Sources */ = {isa = PBXBuildFile; fileRef = AB000003; };
          	AA000004 /* ShopifyService.swift in Sources */ = {isa = PBXBuildFile; fileRef = AB000004; };
          	AA000005 /* TextCorrector.swift in Sources */ = {isa = PBXBuildFile; fileRef = AB000005; };
          	AA000006 /* ConversionService.swift in Sources */ = {isa = PBXBuildFile; fileRef = AB000006; };
          	AA000007 /* BookListView.swift in Sources */ = {isa = PBXBuildFile; fileRef = AB000007; };
          	AA000008 /* BookEditorView.swift in Sources */ = {isa = PBXBuildFile; fileRef = AB000008; };
          	AA000009 /* PublishView.swift in Sources */ = {isa = PBXBuildFile; fileRef = AB000009; };
          	AA000010 /* QueueView.swift in Sources */ = {isa = PBXBuildFile; fileRef = AB000010; };
          	AA000011 /* SettingsView.swift in Sources */ = {isa = PBXBuildFile; fileRef = AB000011; };
          	AA000012 /* BookDetailView.swift in Sources */ = {isa = PBXBuildFile; fileRef = AB000012; };
          	AA000013 /* Assets.xcassets in Resources */ = {isa = PBXBuildFile; fileRef = AB000013; };
          /* End PBXBuildFile section */
          
          /* Begin PBXFileReference section */
          	AB000001 /* DoveHarperApp.swift */ = {isa = PBXFileReference; lastKnownFileType = sourcecode.swift; path = DoveHarperApp.swift; sourceTree = "<group>"; };
          	AB000002 /* Models.swift */ = {isa = PBXFileReference; lastKnownFileType = sourcecode.swift; path = Models.swift; sourceTree = "<group>"; };
          	AB000003 /* GitHubService.swift */ = {isa = PBXFileReference; lastKnownFileType = sourcecode.swift; path = GitHubService.swift; sourceTree = "<group>"; };
          	AB000004 /* ShopifyService.swift */ = {isa = PBXFileReference; lastKnownFileType = sourcecode.swift; path = ShopifyService.swift; sourceTree = "<group>"; };
          	AB000005 /* TextCorrector.swift */ = {isa = PBXFileReference; lastKnownFileType = sourcecode.swift; path = TextCorrector.swift; sourceTree = "<group>"; };
          	AB000006 /* ConversionService.swift */ = {isa = PBXFileReference; lastKnownFileType = sourcecode.swift; path = ConversionService.swift; sourceTree = "<group>"; };
          	AB000007 /* BookListView.swift */ = {isa = PBXFileReference; lastKnownFileType = sourcecode.swift; path = BookListView.swift; sourceTree = "<group>"; };
          	AB000008 /* BookEditorView.swift */ = {isa = PBXFileReference; lastKnownFileType = sourcecode.swift; path = BookEditorView.swift; sourceTree = "<group>"; };
          	AB000009 /* PublishView.swift */ = {isa = PBXFileReference; lastKnownFileType = sourcecode.swift; path = PublishView.swift; sourceTree = "<group>"; };
          	AB000010 /* QueueView.swift */ = {isa = PBXFileReference; lastKnownFileType = sourcecode.swift; path = QueueView.swift; sourceTree = "<group>"; };
          	AB000011 /* SettingsView.swift */ = {isa = PBXFileReference; lastKnownFileType = sourcecode.swift; path = SettingsView.swift; sourceTree = "<group>"; };
          	AB000012 /* BookDetailView.swift */ = {isa = PBXFileReference; lastKnownFileType = sourcecode.swift; path = BookDetailView.swift; sourceTree = "<group>"; };
          	AB000013 /* Assets.xcassets */ = {isa = PBXFileReference; lastKnownFileType = folder.assetcatalog; path = Assets.xcassets; sourceTree = "<group>"; };
          	AB000014 /* Info.plist */ = {isa = PBXFileReference; lastKnownFileType = text.plist.xml; path = Info.plist; sourceTree = "<group>"; };
          	AB000015 /* DoveHarper.app */ = {isa = PBXFileReference; explicitFileType = wrapper.application; includeInIndex = 0; path = DoveHarper.app; sourceTree = BUILT_PRODUCTS_DIR; };
          /* End PBXFileReference section */
          
          /* Begin PBXFrameworksBuildPhase section */
          	AC000001 /* Frameworks */ = {
          		isa = PBXFrameworksBuildPhase;
          		buildActionMask = 2147483647;
          		files = (
          		);
          		runOnlyForDeploymentPostprocessing = 0;
          	};
          /* End PBXFrameworksBuildPhase section */
          
          /* Begin PBXGroup section */
          	AD000001 = {
          		isa = PBXGroup;
          		children = (
          			AD000002 /* DoveHarper */,
          			AD000003 /* Products */,
          		);
          		sourceTree = "<group>";
          	};
          	AD000002 /* DoveHarper */ = {
          		isa = PBXGroup;
          		children = (
          			AB000001 /* DoveHarperApp.swift */,
          			AD000004 /* Models */,
          			AD000005 /* Services */,
          			AD000006 /* Views */,
          			AB000013 /* Assets.xcassets */,
          			AB000014 /* Info.plist */,
          		);
          		path = DoveHarper;
          		sourceTree = "<group>";
          	};
          	AD000003 /* Products */ = {
          		isa = PBXGroup;
          		children = (
          			AB000015 /* DoveHarper.app */,
          		);
          		name = Products;
          		sourceTree = "<group>";
          	};
          	AD000004 /* Models */ = {
          		isa = PBXGroup;
          		children = (
          			AB000002 /* Models.swift */,
          		);
          		path = Models;
          		sourceTree = "<group>";
          	};
          	AD000005 /* Services */ = {
          		isa = PBXGroup;
          		children = (
          			AB000003 /* GitHubService.swift */,
          			AB000004 /* ShopifyService.swift */,
          			AB000005 /* TextCorrector.swift */,
          			AB000006 /* ConversionService.swift */,
          		);
          		path = Services;
          		sourceTree = "<group>";
          	};
          	AD000006 /* Views */ = {
          		isa = PBXGroup;
          		children = (
          			AB000007 /* BookListView.swift */,
          			AB000008 /* BookEditorView.swift */,
          			AB000009 /* PublishView.swift */,
          			AB000010 /* QueueView.swift */,
          			AB000011 /* SettingsView.swift */,
          			AB000012 /* BookDetailView.swift */,
          		);
          		path = Views;
          		sourceTree = "<group>";
          	};
          /* End PBXGroup section */
          
          /* Begin PBXNativeTarget section */
          	AE000001 /* DoveHarper */ = {
          		isa = PBXNativeTarget;
          		buildConfigurationList = AF000003 /* Build configuration list for PBXNativeTarget "DoveHarper" */;
          		buildPhases = (
          			AC000002 /* Sources */,
          			AC000001 /* Frameworks */,
          			AC000003 /* Resources */,
          		);
          		buildRules = (
          		);
          		dependencies = (
          		);
          		name = DoveHarper;
          		productName = DoveHarper;
          		productReference = AB000015 /* DoveHarper.app */;
          		productType = "com.apple.product-type.application";
          	};
          /* End PBXNativeTarget section */
          
          /* Begin PBXProject section */
          	AG000001 /* Project object */ = {
          		isa = PBXProject;
          		attributes = {
          			BuildIndependentTargetsInParallel = 1;
          			LastSwiftUpdateCheck = 1540;
          			LastUpgradeCheck = 1540;
          			TargetAttributes = {
          				AE000001 = {
          					CreatedOnToolsVersion = 15.4;
          				};
          			};
          		};
          		buildConfigurationList = AF000001 /* Build configuration list for PBXProject "DoveHarper" */;
          		compatibilityVersion = "Xcode 14.0";
          		developmentRegion = en;
          		hasScannedForEncodings = 0;
          		knownRegions = (
          			en,
          			Base,
          		);
          		mainGroup = AD000001;
          		productRefGroup = AD000003 /* Products */;
          		projectDirPath = "";
          		projectRoot = "";
          		targets = (
          			AE000001 /* DoveHarper */,
          			);
          	};
          /* End PBXProject section */
          
          /* Begin PBXResourcesBuildPhase section */
          	AC000003 /* Resources */ = {
          		isa = PBXResourcesBuildPhase;
          		buildActionMask = 2147483647;
          		files = (
          			AA000013 /* Assets.xcassets in Resources */,
          		);
          		runOnlyForDeploymentPostprocessing = 0;
          	};
          /* End PBXResourcesBuildPhase section */
          
          /* Begin PBXSourcesBuildPhase section */
          	AC000002 /* Sources */ = {
          		isa = PBXSourcesBuildPhase;
          		buildActionMask = 2147483647;
          		files = (
          			AA000001 /* DoveHarperApp.swift in Sources */,
          			AA000002 /* Models.swift in Sources */,
          			AA000003 /* GitHubService.swift in Sources */,
          			AA000004 /* ShopifyService.swift in Sources */,
          			AA000005 /* TextCorrector.swift in Sources */,
          			AA000006 /* ConversionService.swift in Sources */,
          			AA000007 /* BookListView.swift in Sources */,
          			AA000008 /* BookEditorView.swift in Sources */,
          			AA000009 /* PublishView.swift in Sources */,
          			AA000010 /* QueueView.swift in Sources */,
          			AA000011 /* SettingsView.swift in Sources */,
          			AA000012 /* BookDetailView.swift in Sources */,
          		);
          		runOnlyForDeploymentPostprocessing = 0;
          	};
          /* End PBXSourcesBuildPhase section */
          
          /* Begin XCBuildConfiguration section */
          	AH000001 /* Debug */ = {
          		isa = XCBuildConfiguration;
          		buildSettings = {
          			ALWAYS_SEARCH_USER_PATHS = NO;
          			ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS = YES;
          			CLANG_ANALYZER_NONNULL = YES;
          			CLANG_CXX_LANGUAGE_STANDARD = "gnu++20";
          			CLANG_ENABLE_MODULES = YES;
          			CLANG_ENABLE_OBJC_ARC = YES;
          			COPY_PHASE_STRIP = NO;
          			DEBUG_INFORMATION_FORMAT = dwarf;
          			ENABLE_STRICT_OBJC_MSGSEND = YES;
          			ENABLE_TESTABILITY = YES;
          			GCC_DYNAMIC_NO_PIC = NO;
          			GCC_OPTIMIZATION_LEVEL = 0;
          			GCC_PREPROCESSOR_DEFINITIONS = (
          				"DEBUG=1",
          				"$(inherited)",
          			);
          			GCC_WARN_64_TO_32_BIT_CONVERSION = YES;
          			GCC_WARN_ABOUT_RETURN_TYPE = YES_ERROR;
          			GCC_WARN_UNINITIALIZED_AUTOS = YES_AGGRESSIVE;
          			MTL_ENABLE_DEBUG_INFO = INCLUDE_SOURCE;
          			ONLY_ACTIVE_ARCH = YES;
          			SWIFT_ACTIVE_COMPILATION_CONDITIONS = "$(inherited) DEBUG";
          			SWIFT_OPTIMIZATION_LEVEL = "-Onone";
          			TARGETED_DEVICE_FAMILY = "1,2";
          		};
          		name = Debug;
          	};
          	AH000002 /* Release */ = {
          		isa = XCBuildConfiguration;
          		buildSettings = {
          			ALWAYS_SEARCH_USER_PATHS = NO;
          			ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS = YES;
          			CLANG_ANALYZER_NONNULL = YES;
          			CLANG_CXX_LANGUAGE_STANDARD = "gnu++20";
          			CLANG_ENABLE_MODULES = YES;
          			CLANG_ENABLE_OBJC_ARC = YES;
          			COPY_PHASE_STRIP = NO;
          			DEBUG_INFORMATION_FORMAT = "dwarf-with-dsym";
          			ENABLE_NS_ASSERTIONS = NO;
          			ENABLE_STRICT_OBJC_MSGSEND = YES;
          			GCC_WARN_64_TO_32_BIT_CONVERSION = YES;
          			GCC_WARN_ABOUT_RETURN_TYPE = YES_ERROR;
          			GCC_WARN_UNINITIALIZED_AUTOS = YES_AGGRESSIVE;
          			MTL_ENABLE_DEBUG_INFO = NO;
          			SWIFT_COMPILATION_MODE = wholemodule;
          			TARGETED_DEVICE_FAMILY = "1,2";
          				ENABLE_BITCODE = NO;
          				SUPPORTS_MACCATALYST = NO;
          				SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD = NO;
          		};
          		name = Release;
          	};
          	AH000003 /* Debug */ = {
          		isa = XCBuildConfiguration;
          		buildSettings = {
          			ASSETCATALOG_COMPILER_APPICON_NAME = AppIcon;
          			CODE_SIGN_STYLE = Automatic;
          			CURRENT_PROJECT_VERSION = 1;
          			GENERATE_INFOPLIST_FILE = NO;
          			INFOPLIST_FILE = DoveHarper/Info.plist;
          			INFOPLIST_KEY_CFBundleDisplayName = "Dove Harper";
          			INFOPLIST_KEY_UIApplicationSceneManifest_Generation = YES;
          			INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents = YES;
          			INFOPLIST_KEY_UILaunchScreen_Generation = YES;
          			INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad = "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight";
          			LD_RUNPATH_SEARCH_PATHS = (
          				"$(inherited)",
          				"@executable_path/Frameworks",
          				"@executable_path/../../Frameworks",
          			);
          			MARKETING_VERSION = 1.0;
          			PRODUCT_BUNDLE_IDENTIFIER = com.doveharper.app;
          			PRODUCT_NAME = "$(TARGET_NAME)";
          			SWIFT_EMIT_LOC_STRINGS = YES;
          			SWIFT_STRICT_CONCURRENCY = minimal;
          			SWIFT_VERSION = 5.0;
          			TARGETED_DEVICE_FAMILY = "1,2";
          		};
          		name = Debug;
          	};
          	AH000004 /* Release */ = {
          		isa = XCBuildConfiguration;
          		buildSettings = {
          			ASSETCATALOG_COMPILER_APPICON_NAME = AppIcon;
          			CODE_SIGN_STYLE = Automatic;
          			CURRENT_PROJECT_VERSION = 1;
          			GENERATE_INFOPLIST_FILE = NO;
          			INFOPLIST_FILE = DoveHarper/Info.plist;
          			INFOPLIST_KEY_CFBundleDisplayName = "Dove Harper";
          			INFOPLIST_KEY_UIApplicationSceneManifest_Generation = YES;
          			INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents = YES;
          			INFOPLIST_KEY_UILaunchScreen_Generation = YES;
          			INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad = "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight";
          			LD_RUNPATH_SEARCH_PATHS = (
          				"$(inherited)",
          				"@executable_path/Frameworks",
          				"@executable_path/../../Frameworks",
          			);
          			MARKETING_VERSION = 1.0;
          			PRODUCT_BUNDLE_IDENTIFIER = com.doveharper.app;
          			PRODUCT_NAME = "$(TARGET_NAME)";
          			SWIFT_EMIT_LOC_STRINGS = YES;
          			SWIFT_STRICT_CONCURRENCY = minimal;
          			SWIFT_VERSION = 5.0;
          			TARGETED_DEVICE_FAMILY = "1,2";
          		};
          		name = Release;
          	};
          /* End XCBuildConfiguration section */
          
          /* Begin XCConfigurationList section */
          	AF000001 /* Build configuration list for PBXProject "DoveHarper" */ = {
          		isa = XCConfigurationList;
          		buildConfigurations = (
          			AH000001 /* Debug */,
          			AH000002 /* Release */,
          		);
          		defaultConfigurationIsVisible = 0;
          		defaultConfigurationName = Release;
          	};
          	AF000003 /* Build configuration list for PBXNativeTarget "DoveHarper" */ = {
          		isa = XCConfigurationList;
          		buildConfigurations = (
          			AH000003 /* Debug */,
          			AH000004 /* Release */,
          		);
          		defaultConfigurationIsVisible = 0;
          		defaultConfigurationName = Release;
          	};
          /* End XCConfigurationList section */
          
          	};
          	rootObject = AG000001 /* Project object */;
          }
          PBXPROJ

      - name: Build IPA
        run: |
          cd DoveHarper
          
          # Build for iOS Simulator first (to verify compilation)
          xcodebuild build \
            -project DoveHarper.xcodeproj \
            -scheme DoveHarper \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Release \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            | tail -50
          
          # Build for device (without signing)
          xcodebuild build \
            -project DoveHarper.xcodeproj \
            -scheme DoveHarper \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            | tail -50

      - name: Create IPA
        run: |
          cd DoveHarper
          
          # Create IPA structure
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/DoveHarper.app Payload/
          zip -r DoveHarper.ipa Payload
          
          # Get file size
          ls -lh DoveHarper.ipa

      - name: Upload IPA to Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: DoveHarper v1.0.${{ github.run_number }}
          files: DoveHarper/DoveHarper.ipa
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
