name: Build IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer

      - name: Fix line endings
        run: |
          find . -name "*.swift" -exec sed -i '' 's/\r$//' {} \; 2>/dev/null || true
          find . -name "*.plist" -exec sed -i '' 's/\r$//' {} \; 2>/dev/null || true

      - name: Show project info
        run: |
          xcodebuild -project DoveHarper.xcodeproj -list
          xcodebuild -project DoveHarper.xcodeproj -scheme DoveHarper -showdestinations 2>&1 | head -20 || true

      - name: Build for iOS Device
        run: |
          xcodebuild build \
            -project DoveHarper.xcodeproj \
            -scheme DoveHarper \
            -configuration Release \
            -derivedDataPath build \
            -sdk iphoneos \
            ARCHS=arm64 \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ENABLE_BITCODE=NO \
            2>&1 | tail -80

      - name: Package IPA
        run: |
          APP_PATH=$(find build -name "DoveHarper.app" -type d | head -1)
          
          if [ -z "$APP_PATH" ]; then
            echo "ERROR: Could not find DoveHarper.app"
            find build -type d -name "*.app" 2>/dev/null || echo "No .app directories"
            exit 1
          fi
          
          echo "Found app at: $APP_PATH"
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r DoveHarper.ipa Payload
          ls -lh DoveHarper.ipa

      - name: Upload IPA to Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: DoveHarper v1.0.${{ github.run_number }}
          files: DoveHarper.ipa
          generate_release_notes: true
          body: |
            ## DoveHarper iOS App v1.0.${{ github.run_number }}
            
            ### Installation
            1. Download `DoveHarper.ipa` below
            2. Transfer to your iPhone (AirDrop, iCloud, etc.)
            3. Open with LiveContainer
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
